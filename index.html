<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geora - Das Geografie-Quiz</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d131e;
            --card-bg: #161f2e;
            --accent-green: #58cc02;
            --accent-green-shadow: #46a302;
            --accent-blue: #1cb0f6;
            --accent-blue-shadow: #1899d6;
            --accent-gold: #ffc800;
            --accent-gold-shadow: #d7a200;
            --accent-red: #ff4b4b;
            --accent-red-shadow: #ea2b2b;
            --text-main: #ffffff;
            --text-sub: #8295a9;
            --border-color: #243247;
            --map-bg: #0b1019;
            --map-land: #1f2c3f;
            --map-stroke: #384e6c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* 3D Buttons (Duolingo Style) */
        .btn-3d {
            background-color: var(--accent-green);
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--accent-green-shadow);
            transition: all 0.1s ease;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--accent-green-shadow);
        }

        .btn-blue { background-color: var(--accent-blue); box-shadow: 0 4px 0 var(--accent-blue-shadow); }
        .btn-blue:active { box-shadow: 0 1px 0 var(--accent-blue-shadow); }

        .btn-gold { background-color: var(--accent-gold); color: #2b1f00; box-shadow: 0 4px 0 var(--accent-gold-shadow); }
        .btn-gold:active { box-shadow: 0 1px 0 var(--accent-gold-shadow); }

        .btn-red { background-color: var(--accent-red); box-shadow: 0 4px 0 var(--accent-red-shadow); }
        .btn-red:active { box-shadow: 0 1px 0 var(--accent-red-shadow); }

        /* HEADER & TOP-BAR */
        .top-bar {
            height: 60px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 4px;
            display: flex;
            gap: 4px;
            cursor: pointer;
        }

        .lang-btn {
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--text-sub);
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--accent-blue);
            color: #fff;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* HAUPTMENÜ */
        #main-menu {
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: radial-gradient(circle at center, #182538 0%, #0d131e 100%);
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #1cb0f6, #58cc02);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            color: var(--text-sub);
            font-size: 1.05rem;
            max-width: 450px;
            margin-bottom: 35px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 340px;
        }

        /* CONFIG MENU */
        .config-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 20px 0 10px 0;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
        }

        .option-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            text-align: center;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .option-card:hover, .option-card.selected {
            border-color: var(--accent-blue);
            background: rgba(28, 176, 246, 0.1);
        }

        /* GAMEPLAY SCREEN */
        #game-screen {
            position: relative;
        }

        .game-prompt-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            min-width: 300px;
            justify-content: space-between;
        }

        .prompt-text {
            font-size: 1.25rem;
            font-weight: 800;
        }

        #map-container {
            width: 100%;
            height: 100%;
            background-color: var(--map-bg);
        }

        .leaflet-container {
            background: var(--map-bg) !important;
        }

        /* Stylings für Kartenumrisse */
        .country-polygon {
            fill: var(--map-land);
            fill-opacity: 1;
            stroke: var(--map-stroke);
            stroke-width: 1;
            transition: fill 0.15s, stroke 0.15s;
        }

        .country-polygon:hover {
            fill: #2c415d;
            stroke: var(--accent-blue);
            stroke-width: 1.5;
            cursor: pointer;
        }

        /* INSEL-INSET / INSEL-VERGRÖSSERUNGS-BOX */
        .island-inset-box {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            background: var(--card-bg);
            border: 2px solid var(--accent-blue);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .island-inset-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .island-inset-btn {
            background: rgba(28, 176, 246, 0.2);
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            color: #fff;
            padding: 6px 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .island-inset-btn:hover {
            background: var(--accent-blue);
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="logo"><span>🌍</span> GEORA</div>

        <div class="top-controls">
            <!-- Sprachschalter UK/DE -->
            <div class="lang-toggle" onclick="toggleLanguage()">
                <div id="lang-de" class="lang-btn active">DE 🇩🇪</div>
                <div id="lang-en" class="lang-btn">UK 🇬🇧</div>
            </div>

            <div class="stat-badge">⏱️ <span id="global-timer">00:00</span></div>
            <div class="stat-badge">⚡ <span id="global-xp">0 XP</span></div>
        </div>
    </header>

    <!-- 1. HAUPTMENÜ SCREEN -->
    <section id="main-menu" class="screen active">
        <h1 class="hero-title">GEORA</h1>
        <p class="hero-subtitle" id="i18n-subtitle">Erkunde die Welt, meistere Geografie & lerne alle Länder und Territorien.</p>

        <div class="menu-grid">
            <button class="btn-3d" onclick="switchScreen('mode-selection')">
                🎮 <span id="i18n-startbtn">Spiel starten</span>
            </button>
        </div>
    </section>

    <!-- 2. AUSWAHL SCREEN -->
    <section id="mode-selection" class="screen">
        <div class="config-container">
            <button class="btn-3d btn-blue" style="padding: 6px 14px; font-size: 0.85rem;" onclick="switchScreen('main-menu')">
                ← <span id="i18n-back">Hauptmenü</span>
            </button>

            <div class="section-title" id="i18n-sec1">1. Spielmodus wählen</div>
            <div class="option-grid">
                <div class="option-card selected" onclick="selectMode('click', this)">
                    <div style="font-size: 1.6rem;">👆</div>
                    <div id="i18n-mode1">Suchen & Klicken</div>
                </div>
                <div class="option-card" onclick="selectMode('type', this)">
                    <div style="font-size: 1.6rem;">✍️</div>
                    <div id="i18n-mode2">Erkennen & Benennen</div>
                </div>
            </div>

            <div class="section-title" id="i18n-sec2">2. Schwierigkeitsgrad</div>
            <div class="option-grid">
                <div class="option-card selected" onclick="selectDifficulty('easy', this)">
                    <div id="i18n-diff1">Bekannteste (Top 50)</div>
                </div>
                <div class="option-card" onclick="selectDifficulty('all', this)">
                    <div id="i18n-diff2">Alle Territorien</div>
                </div>
            </div>

            <div style="margin-top: 25px; text-align: center;">
                <button class="btn-3d btn-gold" style="width: 100%; max-width: 280px;" onclick="startGame()">
                    🚀 <span id="i18n-playbtn">JETZT SPIELEN</span>
                </button>
            </div>
        </div>
    </section>

    <!-- 3. GAMEPLAY SCREEN -->
    <section id="game-screen" class="screen">
        <div class="game-prompt-bar">
            <div id="target-prompt" class="prompt-text">Finde: Deutschland</div>
            <button class="btn-3d btn-red" style="padding: 6px 12px; font-size: 0.8rem;" onclick="quitGame()" title="Runde abbrechen">
                ✖️ <span id="i18n-quit">Abbrechen</span>
            </button>
        </div>

        <div id="map-container"></div>

        <!-- Insel / Regionen Quick-Zoom Box -->
        <div class="island-inset-box" id="island-box">
            <div class="island-inset-title">🔍 Insel-Fokus</div>
            <button class="island-inset-btn" onclick="zoomRegion('caribbean')">🏝️ Karibik</button>
            <button class="island-inset-btn" onclick="zoomRegion('oceania')">🌊 Ozeanien</button>

        </div>
    </section>

    <script>
        // SPRACH-WÖRTERBUCH (DE / UK English)
        const i18n = {
            de: {
                subtitle: "Erkunde die Welt, meistere Geografie & lerne alle Länder.",
                startbtn: "Spiel starten",
                back: "Hauptmenü",
                sec1: "1. Spielmodus wählen",
                sec2: "2. Schwierigkeitsgrad",
                mode1: "Suchen & Klicken",
                mode2: "Erkennen & Benennen",
                diff1: "Bekannteste (Top 50)",
                diff2: "Alle Territorien (Inseln)",
                playbtn: "JETZT SPIELEN",
                quit: "Abbrechen",
                find: "Finde: "
            },
            en: {
                subtitle: "Explore the world, master geography & learn all countries.",
                startbtn: "Start Game",
                back: "Main Menu",
                sec1: "1. Select Game Mode",
                sec2: "2. Difficulty",
                mode1: "Search & Click",
                mode2: "Recognise & Type",
                diff1: "Top 50 Known",
                diff2: "All Territories (Islands)",
                playbtn: "PLAY NOW",
                quit: "Quit",
                find: "Find: "
            }
        };

        // NAMEN-ÜBERSETZUNGEN FÜR DEUTSCHE NAMEN (UK English ISO standard fallback)
        const countryNamesDE = {
            "DEU": "Deutschland", "FRA": "Frankreich", "ESP": "Spanien", "ITA": "Italien",
            "GBR": "Vereinigtes Königreich", "USA": "Vereinigte Staaten", "CAN": "Kanada",
            "BRA": "Brasilien", "RUS": "Russland", "CHN": "China", "IND": "Indien",
            "AUS": "Australien", "EGY": "Ägypten", "JPN": "Japan", "MEX": "Mexiko"
        };

        let currentLang = 'de';
        let selectedMode = 'click';
        let selectedDifficulty = 'easy';
        let timerInterval = null;
        let secondsElapsed = 0;
        let map = null;
        let geojsonLayer = null;
        let currentTarget = null;
        let geoData = null;
        let remainingDeck = []; // Verhindert doppelte Länder

        const top50ISO = ["DEU", "FRA", "ESP", "ITA", "GBR", "POL", "SWE", "NOR", "FIN", "UKR", "ROU", "GRC", "PRT", "AUT", "CHE", "NLD", "BEL", "DNK", "IRL", "TUR", "USA", "CAN", "MEX", "BRA", "ARG", "CHL", "COL", "PER", "AUS", "NZL", "CHN", "IND", "JPN", "KOR", "IDN", "EGY", "ZAF", "NGA", "KEN", "MAR", "RUS", "KAZ", "SAU", "ARE", "THA", "VNM", "MYS", "PHL", "PAK", "DZA"];

        function toggleLanguage() {
            currentLang = currentLang === 'de' ? 'en' : 'de';
            document.getElementById('lang-de').classList.toggle('active', currentLang === 'de');
            document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');

            // UI Texte anpassen
            document.getElementById('i18n-subtitle').textContent = i18n[currentLang].subtitle;
            document.getElementById('i18n-startbtn').textContent = i18n[currentLang].startbtn;
            document.getElementById('i18n-back').textContent = i18n[currentLang].back;
            document.getElementById('i18n-sec1').textContent = i18n[currentLang].sec1;
            document.getElementById('i18n-sec2').textContent = i18n[currentLang].sec2;
            document.getElementById('i18n-mode1').textContent = i18n[currentLang].mode1;
            document.getElementById('i18n-mode2').textContent = i18n[currentLang].mode2;
            document.getElementById('i18n-diff1').textContent = i18n[currentLang].diff1;
            document.getElementById('i18n-diff2').textContent = i18n[currentLang].diff2;
            document.getElementById('i18n-playbtn').textContent = i18n[currentLang].playbtn;
            document.getElementById('i18n-quit').textContent = i18n[currentLang].quit;

            if (currentTarget) updatePrompt();
        }

        function getCountryName(feature) {
            if (currentLang === 'de' && countryNamesDE[feature.id]) {
                return countryNamesDE[feature.id];
            }
            return feature.properties.name; // Standard UK/English
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectMode(mode, el) {
            selectedMode = mode;
            el.parentElement.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectDifficulty(diff, el) {
            selectedDifficulty = diff;
            el.parentElement.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('global-timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function initMap() {
            if (map) return;

            // Karte mit Begrenzung (Antarktis unten leicht abgeschnitten)
            map = L.map('map-container', {
                center: [20, 0],
                zoom: 2,
                minZoom: 2,
                maxBounds: [[-65, -180], [85, 180]],
                maxBoundsViscosity: 0.9,
                zoomControl: false
            });

            fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
                .then(res => res.json())
                .then(data => {
                    geoData = data;
                    setupGeoJsonLayer();
                    resetDeck();
                    nextRound();
                });
        }

        function setupGeoJsonLayer() {
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            geojsonLayer = L.geoJSON(geoData, {
                style: { className: 'country-polygon' },
                onEachFeature: (feature, layer) => {
                    layer.on('click', () => {
                        if (selectedMode === 'click') handleCountryClick(feature, layer);
                    });
                }
            }).addTo(map);
        }

        function resetDeck() {
            if (!geoData) return;
            if (selectedDifficulty === 'easy') {
                remainingDeck = geoData.features.filter(f => top50ISO.includes(f.id));
            } else {
                remainingDeck = [...geoData.features];
            }
        }

        function startGame() {
            switchScreen('game-screen');
            startTimer();
            setTimeout(() => {
                initMap();
                if (map) {
                    map.invalidateSize();
                    resetDeck();
                    nextRound();
                }
            }, 100);
        }

        function quitGame() {
            clearInterval(timerInterval);
            switchScreen('main-menu');
        }

        function updatePrompt() {
            document.getElementById('target-prompt').textContent = `${i18n[currentLang].find}${getCountryName(currentTarget)}`;
        }

        function nextRound() {
            if (!geoData) return;

            // Zurücksetzen
            geojsonLayer.eachLayer(layer => {
                layer.setStyle({ fillColor: '#1f2c3f', stroke: '#384e6c' });
            });

            if (remainingDeck.length === 0) resetDeck();

            // Zufälliges Land ohne Wiederholung entnehmen
            const index = Math.floor(Math.random() * remainingDeck.length);
            currentTarget = remainingDeck.splice(index, 1)[0];

            updatePrompt();

            // Inset-Box für Inseln anzeigen
            document.getElementById('island-box').style.display = selectedDifficulty === 'all' ? 'flex' : 'none';
        }

        function handleCountryClick(feature, layer) {
            if (feature.id === currentTarget.id || feature.properties.name === currentTarget.properties.name) {
                layer.setStyle({ fillColor: '#58cc02' });
                setTimeout(() => { nextRound(); }, 400);
            } else {
                layer.setStyle({ fillColor: '#ff4b4b' });
            }
        }

        function zoomRegion(region) {
            if (region === 'caribbean') {
                map.flyTo([15, -70], 5);
            } else if (region === 'oceania') {
                map.flyTo([-15, 175], 4);
            }
        }
    </script>
</body>
</html>
