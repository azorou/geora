<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Geora – Das Geografie-Quiz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1017;--card:#151d2a;--line:#233146;--blue:#1cb0f6;--green:#58cc02;--gold:#ffc800;--red:#ff4b4b;--sub:#8295a9}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',system-ui,sans-serif;user-select:none}
html,body{height:100%}
body{background:var(--bg);color:#fff;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;flex:none;background:var(--card);border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-weight:900;font-size:1.4rem;color:var(--blue)}
.top{display:flex;gap:8px;align-items:center}
.badge{background:#ffffff0d;border:1px solid var(--line);border-radius:12px;padding:5px 11px;font-weight:800;font-size:.9rem}
.lang{display:flex;border:2px solid var(--line);border-radius:12px;padding:2px;cursor:pointer}
.lang span{padding:3px 9px;border-radius:9px;font-weight:800;font-size:.85rem;color:var(--sub)}
.lang span.on{background:var(--blue);color:#fff}
main{flex:1;min-height:0;display:flex}
.screen{display:none;width:100%;flex-direction:column}
.screen.on{display:flex}
.btn{border:0;border-radius:16px;padding:13px 22px;font-weight:900;font-size:1rem;color:#fff;background:var(--green);box-shadow:0 4px 0 #46a302;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #46a302}
.btn.red{background:var(--red);box-shadow:0 4px 0 #ea2b2b;padding:8px 14px;font-size:.85rem}
.btn.gold{background:var(--gold);color:#2b1f00;box-shadow:0 4px 0 #d7a200}
#menu{align-items:center;justify-content:center;padding:20px;overflow-y:auto;background:radial-gradient(circle at center,#172436,#0b1017)}
.hero{font-size:3.4rem;font-weight:900;background:linear-gradient(135deg,#1cb0f6,#58cc02);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--sub);margin:4px 0 22px;text-align:center}
.box{width:100%;max-width:560px}
.h{font-weight:800;color:var(--sub);margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;font-weight:800;cursor:pointer}
.opt.on{border-color:var(--blue);background:#1cb0f61a}
#game{padding:0 12px 12px}
.gbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 4px}
#tg{font-size:1.3rem;font-weight:900;flex:1;min-width:160px}
#tr{color:var(--gold);letter-spacing:3px;font-size:1.1rem}
#pg{color:var(--sub);font-weight:800}
#typebox{display:none;gap:8px;width:100%}
#typebox input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:12px;color:#fff;padding:9px 12px;font-size:1rem;font-weight:800;outline:none;user-select:text}
#typebox input.bad{border-color:var(--red)}
.wrap{flex:1;min-height:0;position:relative;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#090e15}
#map,.imap{width:100%;height:100%;background:#090e15}
.inset{position:absolute;bottom:12px;z-index:1000;width:min(240px,40vw);height:min(150px,26vh);border:2px solid var(--blue);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px #000a}
#ic{left:12px}#io{right:12px}
.inset b{position:absolute;top:4px;left:6px;z-index:1001;font-size:.72rem;background:#0b1017cc;color:var(--blue);padding:2px 7px;border-radius:6px}
.leaflet-bar a{background:var(--card);color:#fff;border-color:var(--line)}
.leaflet-container{background:#090e15;cursor:default}
</style>
</head>
<body>
<header>
  <div class="logo">🌍 GEORA</div>
  <div class="top">
    <div class="lang" id="lang"><span id="ld" class="on">DE</span><span id="le">UK</span></div>
    <div class="badge">⏱ <span id="timer">00:00</span></div>
    <div class="badge">⚡ <span id="xp">0 XP</span></div>
  </div>
</header>
<main>
<section id="menu" class="screen on">
  <div class="hero">GEORA</div>
  <p class="sub" data-t="sub"></p>
  <div class="box">
    <div class="h" data-t="mode"></div>
    <div class="grid" id="modes">
      <div class="opt on" data-v="click">👆 <span data-t="m1"></span></div>
      <div class="opt" data-v="type">✍️ <span data-t="m2"></span></div>
    </div>
    <div class="h" data-t="diff"></div>
    <div class="grid" id="diffs">
      <div class="opt on" data-v="top" data-t="d1"></div>
      <div class="opt" data-v="un" data-t="d2"></div>
      <div class="opt" data-v="all" data-t="d3"></div>
    </div>
    <div style="text-align:center;margin-top:24px"><button class="btn gold" id="play" style="width:260px" data-t="play"></button></div>
  </div>
</section>
<section id="game" class="screen">
  <div class="gbar">
    <div id="tg"></div><div id="tr"></div><div id="pg"></div>
    <button class="btn red" id="quit" data-t="quit"></button>
    <div id="typebox"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="ok">OK</button></div>
  </div>
  <div class="wrap">
    <div id="map"></div>
    <div class="inset" id="ic"><b>🏝 Karibik</b><div class="imap" id="mc"></div></div>
    <div class="inset" id="io"><b>🌊 Ozeanien</b><div class="imap" id="mo"></div></div>
  </div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const T={
 de:{sub:"Lerne alle Länder und Gebiete der Welt.",mode:"Spielmodus",m1:"Suchen & Klicken",m2:"Erkennen & Benennen",diff:"Umfang",d1:"Bekannteste 50",d2:"UN-Staaten (ca. 195)",d3:"Alle Gebiete",play:"🚀 Jetzt spielen",quit:"✖ Abbrechen",find:"Finde:",what:"Welches Land ist markiert?",done:"🎉 Geschafft!",ph:"Ländername …",fail:"Es war:",err:"Kartendaten konnten nicht geladen werden."},
 en:{sub:"Learn every country and territory in the world.",mode:"Game mode",m1:"Search & Click",m2:"Recognise & Type",diff:"Scope",d1:"Top 50",d2:"UN states (approx. 195)",d3:"All territories",play:"🚀 Play now",quit:"✖ Quit",find:"Find:",what:"Which country is highlighted?",done:"🎉 Done!",ph:"Country name …",fail:"It was:",err:"Could not load the map data."}
};
const TOP="276 250 724 380 826 616 752 578 246 804 642 300 620 040 756 528 056 208 372 792 840 124 484 076 032 152 170 604 036 554 156 356 392 410 360 818 710 566 404 504 643 398 682 784 764 704 458 608 586 012".split(" ");
// Gebiete ohne eigenen UN-Sitz (Taiwan, Grönland, Überseegebiete …)
const NON=new Set("010 158 304 630 238 540 260 732 344 446 531 533 534 060 136 092 850 500 660 796 570 184 258 876 016 316 580 574 162 166 654 666 248 234 292 831 832 833 744 239 086 334 772 175 638 474 312 254 652 663 535 612 678".split(" "));
const COL=["#ffffff","#ffd9a8","#ff8a5c","#e03131"],XPV=[10,6,3,1],FAILC="#8e1b1b",BASE="#1f2d42";
const $=id=>document.getElementById(id);
let lang="de",mode="click",diff="top",feats=null,maps={},layers={},solved={},tmp={};
let deck=[],target=null,tries=0,done=0,total=0,xp=0,locked=false,timerI=null,sec=0,over=false;
const dn={de:new Intl.DisplayNames(["de"],{type:"region"}),en:new Intl.DisplayNames(["en-GB"],{type:"region"})};

function nm(f,l=lang){
  if(/^\d{3}$/.test(f.id)){try{const n=dn[l].of(f.id);if(n&&n!==f.id)return n}catch(e){}}
  return f.properties.name;
}
function applyLang(){
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[lang][e.dataset.t]);
  $("ld").classList.toggle("on",lang==="de");$("le").classList.toggle("on",lang==="en");
  $("inp").placeholder=T[lang].ph;
  if(target)upd();
}
$("lang").onclick=()=>{lang=lang==="de"?"en":"de";applyLang()};
function pick(box,fn){$(box).onclick=e=>{const o=e.target.closest(".opt");if(!o)return;$(box).querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));o.classList.add("on");fn(o.dataset.v)}}
pick("modes",v=>mode=v);pick("diffs",v=>diff=v);
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}

// Fläche (km²) und Mittelpunkt des größten Teilstücks, für Punkte bei Mini-Staaten
function info(f){
  const g=f.geometry,polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;
  let tot=0,best=[0,0],ba=-1;
  polys.forEach(p=>{
    const r=p[0],n=r.length;let sx=0,sy=0;r.forEach(c=>{sx+=c[0];sy+=c[1]});
    const cx=sx/n,cy=sy/n,k=Math.cos(cy*Math.PI/180);let a=0;
    for(let i=0;i<n-1;i++)a+=r[i][0]*k*r[i+1][1]-r[i+1][0]*k*r[i][1];
    a=Math.abs(a)/2*111*111;tot+=a;if(a>ba){ba=a;best=[cy,cx]}
  });
  f.area=tot;f.center=best;
}
function shift(g){const m=c=>typeof c[0]==="number"?[c[0]+360,c[1]]:c.map(m);return{type:g.type,coordinates:m(g.coordinates)}}

const fillOf=id=>tmp[id]||solved[id]||(mode==="type"&&target&&target.id===id?"#ffc800":BASE);
const polySt=id=>({fillColor:fillOf(id),fillOpacity:1,color:"#3b516f",weight:.7});
const dotSt=id=>({radius:5,fillColor:fillOf(id),fillOpacity:1,color:"#fff",weight:1.2});
function refresh(id){(layers[id]||[]).forEach(l=>l.setStyle(l.dot?dotSt(id):polySt(id)))}
function refreshAll(){Object.keys(layers).forEach(refresh)}

function addData(m,data){
  L.geoJSON(data,{style:f=>polySt(f.id),onEachFeature:(f,l)=>{(layers[f.id]=layers[f.id]||[]).push(l);l.on("click",()=>clicked(f.id))}}).addTo(m);
  data.forEach(f=>{
    if(f.area>=20000)return;
    const d=L.circleMarker(f.center,dotSt(f.id)).addTo(m);d.dot=true;
    (layers[f.id]=layers[f.id]||[]).push(d);d.on("click",()=>clicked(f.id));
  });
}
function mk(el,o){return L.map(el,Object.assign({preferCanvas:true,zoomControl:false,attributionControl:false,zoomSnap:.25},o))}
function still(){return{dragging:false,touchZoom:false,doubleClickZoom:false,scrollWheelZoom:false,boxZoom:false,keyboard:false}}

async function init(){
  if(feats)return true;
  try{
    const t=await(await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json")).json();
    feats=topojson.feature(t,t.objects.countries).features.filter(f=>f.id!=="010");
    feats.forEach(f=>{f.id=f.id!=null?String(f.id):"x_"+f.properties.name;info(f)});
  }catch(e){$("tg").textContent=T[lang].err;return false}
  maps.main=mk("map",{minZoom:1,maxBounds:[[-58,-180],[84,180]],maxBoundsViscosity:1});
  L.control.zoom({position:"topleft"}).addTo(maps.main);
  maps.car=mk("mc",still());maps.oce=mk("mo",still());
  addData(maps.main,feats);addData(maps.car,feats);addData(maps.oce,feats);
  addData(maps.oce,feats.map(f=>({...f,geometry:shift(f.geometry),center:[f.center[0],f.center[1]+360]})));
  return true;
}
function fit(){
  Object.values(maps).forEach(m=>m.invalidateSize());
  maps.main.fitBounds([[-55,-170],[80,180]],{animate:false});maps.main.setMinZoom(maps.main.getZoom());
  maps.car.fitBounds([[9.5,-86],[23.5,-58.5]],{animate:false});
  maps.oce.fitBounds([[-24,128],[14,190]],{animate:false});
}

function pool(){
  if(diff==="top")return feats.filter(f=>TOP.includes(f.id));
  if(diff==="un")return feats.filter(f=>/^\d{3}$/.test(f.id)&&!NON.has(f.id));
  return feats.slice();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

async function start(){
  show("game");
  if(!await init())return;
  solved={};tmp={};xp=0;done=0;over=false;
  deck=shuffle(pool());total=deck.length; // jedes Land genau einmal
  $("typebox").style.display=mode==="type"?"flex":"none";
  fit();refreshAll();
  clearInterval(timerI);sec=0;$("timer").textContent="00:00";
  timerI=setInterval(()=>{sec++;$("timer").textContent=String(sec/60|0).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);
  next();
}
function quit(){clearInterval(timerI);target=null;over=true;show("menu")}
function upd(){
  $("xp").textContent=xp+" XP";$("pg").textContent=done+" / "+total;
  if(over){$("tg").textContent=T[lang].done;$("tr").textContent="";return}
  $("tg").textContent=mode==="click"?T[lang].find+" "+nm(target):T[lang].what;
  $("tr").textContent="●".repeat(4-tries)+"○".repeat(tries);
}
function next(){
  locked=false;tries=0;
  if(!deck.length){over=true;target=null;clearInterval(timerI);upd();return}
  target=deck.pop();upd();
  if(mode==="type"){
    refresh(target.id);$("inp").value="";$("inp").focus();
    const l=(layers[target.id]||[]).find(x=>x.getBounds);
    if(l)maps.main.flyToBounds(l.getBounds(),{maxZoom:4,duration:.7});
  }
}
function flash(id,c,ms,cb){tmp[id]=c;refresh(id);setTimeout(()=>{delete tmp[id];refresh(id);cb&&cb()},ms)}
function win(){
  solved[target.id]=COL[tries-1];xp+=XPV[tries-1];done++;locked=true;refresh(target.id);upd();setTimeout(next,450);
}
function lose(){
  const t=target;solved[t.id]=FAILC;done++;locked=true;upd();
  if(mode==="type")$("tg").textContent=T[lang].fail+" "+nm(t);
  flash(t.id,"#58cc02",1100,next);
}
function clicked(id){
  if(mode!=="click"||!target||locked||over)return;
  tries++;
  if(id===target.id)return win();
  flash(id,"#ff4b4b",450);
  tries>=4?lose():upd();
}
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");
function submit(){
  if(mode!=="type"||!target||locked||over)return;
  const v=nz($("inp").value);if(!v)return;
  tries++;
  const ok=[nm(target,"de"),nm(target,"en"),target.properties.name].some(n=>nz(n)===v);
  if(ok)return win();
  $("inp").classList.add("bad");setTimeout(()=>$("inp").classList.remove("bad"),400);$("inp").value="";
  tries>=4?lose():upd();
}
$("ok").onclick=submit;$("inp").onkeydown=e=>{if(e.key==="Enter")submit()};
$("play").onclick=start;$("quit").onclick=quit;
applyLang();
</script>
</body>
</html>
